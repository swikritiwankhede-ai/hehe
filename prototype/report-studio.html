<title>Post-Event Report Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F2F0; --surface:#FFFFFF; --surface-2:#F9F7F5; --ink:#1C1B1E; --ink-2:#48434A; --muted:#766F73; --line:#E4DEDA; --line-2:#EFEAE6;
  --accent:#C8232C; --accent-soft:#F8E4E3;
  --good:#1D7349; --good-soft:#E2F1E8; --warn:#9A5D08; --warn-soft:#FAEFD9; --bad:#B4431A; --bad-soft:#F9E3D8; --info:#2D5B85; --info-soft:#E3ECF5;
  --c1:#C8232C; --c2:#2D5B85; --c3:#C98A1C; --c4:#3C7D68; --c5:#7E5A9B; --c6:#A59DA0;
  --btn:#1C1B1E; --btn-ink:#FFFFFF;
  --serif:"Newsreader", Georgia, "Times New Roman", serif;
  --sans:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#141315; --surface:#1C1B1E; --surface-2:#222024; --ink:#F2EEEC; --ink-2:#CEC7C5; --muted:#9A9195; --line:#34303A; --line-2:#29262B;
    --accent:#F0575E; --accent-soft:#3A1D20;
    --good:#5CC08D; --good-soft:#17301F; --warn:#E3A948; --warn-soft:#33270F; --bad:#F08A5D; --bad-soft:#3A2216; --info:#7FB0DD; --info-soft:#18283A;
    --c1:#F0575E; --c2:#6FA4D8; --c3:#E3A948; --c4:#6CC3A4; --c5:#B88BD0; --c6:#7E767A;
    --btn:#F2EEEC; --btn-ink:#1C1B1E;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#141315; --surface:#1C1B1E; --surface-2:#222024; --ink:#F2EEEC; --ink-2:#CEC7C5; --muted:#9A9195; --line:#34303A; --line-2:#29262B;
  --accent:#F0575E; --accent-soft:#3A1D20;
  --good:#5CC08D; --good-soft:#17301F; --warn:#E3A948; --warn-soft:#33270F; --bad:#F08A5D; --bad-soft:#3A2216; --info:#7FB0DD; --info-soft:#18283A;
  --c1:#F0575E; --c2:#6FA4D8; --c3:#E3A948; --c4:#6CC3A4; --c5:#B88BD0; --c6:#7E767A;
  --btn:#F2EEEC; --btn-ink:#1C1B1E;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5}
h1,h2,h3{font-family:var(--serif);font-weight:600;text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.app{max-width:1380px;margin:0 auto;padding-inline:16px;padding-block:0 48px}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:28px;height:28px;border-radius:6px;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--serif);font-weight:600;font-size:15px}
.brand b{font-family:var(--serif);font-size:17px;font-weight:600}
.brand small{display:block;color:var(--muted);font-size:12px;line-height:1.2}
.evt{display:flex;flex-direction:column;line-height:1.3;min-width:0}
.evt strong{font-size:14px}
.evt span{color:var(--muted);font-size:12px}
.spacer{flex:1}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--ink-2);white-space:nowrap}
.chip.sample{border-style:dashed}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;font-weight:500}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.btn.small{padding:4px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* timeline */
.timeline{display:flex;gap:0;margin-block:14px 18px;overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.stage{flex:1;min-width:150px;padding:10px 14px;border-right:1px solid var(--line-2);position:relative}
.stage:last-child{border-right:0}
.stage .when{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.stage .what{font-size:13px;font-weight:500}
.stage .sub{font-size:12px;color:var(--muted)}
.stage.done .what{color:var(--ink-2)}
.stage.now{background:var(--accent-soft)}
.stage.now::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}

/* layout */
.body{display:grid;grid-template-columns:210px minmax(0,1fr);gap:24px;align-items:start}
nav.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 78px);display:flex;flex-direction:column;gap:2px}
nav.side button{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;border:0;background:none;border-radius:8px;padding:8px 12px;color:var(--ink-2)}
nav.side button:hover{background:var(--surface)}
nav.side button[aria-current="page"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
.count{font-family:var(--mono);font-size:11px;border-radius:999px;padding:1px 7px;background:var(--line-2);color:var(--ink-2)}
.count.warn{background:var(--warn-soft);color:var(--warn)}
.count.bad{background:var(--bad-soft);color:var(--bad)}
.navsec{margin-top:14px;padding:0 12px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.navsecs{display:flex;flex-direction:column;gap:0;margin-top:4px}
.navsecs a{padding:4px 12px;color:var(--ink-2);text-decoration:none;font-size:12.5px;border-radius:6px;display:flex;gap:8px;align-items:center}
.navsecs a:hover{background:var(--surface)}
.navsecs .sdot{width:7px;height:7px;border-radius:50%;flex:none}

main{min-width:0;display:flex;flex-direction:column;gap:16px}
.pagehead{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:10px}
.pagehead h1{font-size:26px}
.pagehead p{margin:4px 0 0;color:var(--muted);max-width:70ch}
.banner{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;border:1px solid var(--line);border-left:3px solid var(--warn);background:var(--surface);border-radius:10px;padding:10px 14px}
.banner b{font-weight:600}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:500;text-decoration:underline;text-underline-offset:3px}

/* section cards */
.sec{background:var(--surface);border:1px solid var(--line);border-radius:12px;scroll-margin-top:90px}
.sec-h{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:14px 18px 10px;border-bottom:1px solid var(--line-2)}
.sec-h .idx{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:24px}
.sec-h h2{font-size:19px}
.sec-h .right{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toggle{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--ink-2)}
.toggle input{accent-color:var(--accent);width:15px;height:15px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:500;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.neutral{background:var(--line-2);color:var(--ink-2)}
.sec-b{padding:16px 18px;display:flex;flex-direction:column;gap:16px}
.take{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;background:var(--surface-2);border:1px solid var(--line-2);border-radius:8px;padding:9px 12px}
.take p{margin:0;flex:1;min-width:220px;font-family:var(--serif);font-size:16px;line-height:1.4}
.foot{font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;background:var(--surface)}
.tile .v{font-family:var(--mono);font-size:24px;font-weight:500;line-height:1.2;font-variant-numeric:tabular-nums}
.tile .l{font-size:12px;color:var(--ink-2)}
.tile .n{font-size:11px;color:var(--muted);font-family:var(--mono)}
.sub-h{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-family:var(--sans);font-weight:500}

/* charts */
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:10px;align-items:center;font-size:12.5px}
.bar .lab{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .trk{display:block;height:12px;background:var(--line-2);border-radius:3px;overflow:hidden}
.bar .fil{display:block;height:100%;border-radius:3px}
.bar .val{font-family:var(--mono);font-size:12px;min-width:74px;text-align:right;font-variant-numeric:tabular-nums}
.donutwrap{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.donut{width:140px;height:140px;border-radius:50%;position:relative;flex:none}
.donut::after{content:"";position:absolute;inset:26px;border-radius:50%;background:var(--surface)}
.donut .ctr{position:absolute;inset:0;display:grid;place-items:center;z-index:1;text-align:center;line-height:1.1}
.donut .ctr b{font-family:var(--mono);font-size:20px;font-weight:500}
.donut .ctr span{font-size:11px;color:var(--muted);display:block}
.legend{display:flex;flex-direction:column;gap:5px;font-size:12.5px;min-width:160px;flex:1}
.legend div{display:grid;grid-template-columns:10px 1fr auto auto;gap:8px;align-items:center}
.legend i{width:10px;height:10px;border-radius:2px}
.legend .num{color:var(--muted)}
.wall{display:flex;flex-wrap:wrap;gap:6px}
.wall span{border:1px solid var(--line);border-radius:6px;padding:4px 9px;font-size:12.5px;background:var(--surface-2)}
.wall span em{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:6px}
.curve svg{width:100%;height:auto;display:block}
.curve text{font-family:var(--mono);font-size:10px;fill:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:11.5px;letter-spacing:.03em;text-transform:uppercase;border-bottom:1px solid var(--line);padding:6px 8px;white-space:nowrap}
td{border-bottom:1px solid var(--line-2);padding:6px 8px;vertical-align:top}
td.r,th.r{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
details.dd{border-top:1px solid var(--line-2)}
details.dd summary{cursor:pointer;padding:10px 18px;font-size:12.5px;color:var(--ink-2);list-style:none;display:flex;gap:8px;align-items:center}
details.dd summary::-webkit-details-marker{display:none}
details.dd summary::before{content:"▸";font-size:10px;transition:transform .15s}
details.dd[open] summary::before{transform:rotate(90deg)}
details.dd .inner{padding:0 18px 16px;display:flex;flex-direction:column;gap:8px}
.ddtools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.ddtools input{border:1px solid var(--line);border-radius:6px;padding:4px 8px;background:var(--surface);min-width:200px}
.empty{border:1px dashed var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:6px;background:var(--surface-2)}
.empty b{font-size:14px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ph{aspect-ratio:3/2;border-radius:8px;position:relative;overflow:hidden;background:var(--line-2);max-width:100%}
.ph .lbl{position:absolute;left:6px;bottom:6px;font-size:11px;background:var(--surface);border-radius:4px;padding:1px 6px}
.ph.missing{border:1px dashed var(--line);background:transparent;display:grid;place-items:center;color:var(--muted);font-size:12px}
.quote{margin:0;font-family:var(--serif);font-size:15px}

/* list pages */
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line-2);align-items:start}
.row:last-child{border-bottom:0}
.row .ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600}
.ic.good{background:var(--good-soft);color:var(--good)}
.ic.warn{background:var(--warn-soft);color:var(--warn)}
.ic.bad{background:var(--bad-soft);color:var(--bad)}
.ic.info{background:var(--info-soft);color:var(--info)}
.row .t{font-weight:500}
.row .d{color:var(--muted);font-size:12.5px}
.row .side-r{display:flex;flex-direction:column;align-items:end;gap:4px;font-size:12px;color:var(--muted);text-align:right}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.card h3{font-size:16px}
.card .mod{font-size:12px;color:var(--muted)}
.card code{font-family:var(--mono);font-size:11px;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line-2);border-radius:6px;padding:6px 8px;display:block;white-space:normal;word-break:break-word}
.card .stat{display:flex;justify-content:space-between;align-items:center;font-size:12.5px}
.card .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card .msg{font-size:12px;color:var(--good)}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.rq{display:grid;grid-template-columns:minmax(0,1.4fr) auto minmax(0,1fr) minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line-2)}
.rq:last-child{border-bottom:0}
.rq select{border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:var(--surface);width:100%}
.rq .raw{font-family:var(--mono);font-size:12.5px;word-break:break-word}
.rqhead{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;background:var(--surface-2)}

/* modal */
.modal[hidden]{display:none}
.modal{position:fixed;inset:0;z-index:50;background:rgba(20,18,20,.45);display:grid;place-items:center;padding:16px}
.dialog{background:var(--surface);border:1px solid var(--line);border-radius:14px;width:min(980px,100%);max-height:calc(100% - 32px);overflow:auto;display:flex;flex-direction:column}
.dialog header{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line-2);position:sticky;top:0;background:var(--surface);z-index:2}
.dialog header h2{font-size:20px}
.dialog .db{padding:16px 20px;display:flex;flex-direction:column;gap:14px}
.dialog footer{display:flex;gap:10px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line-2);position:sticky;bottom:0;background:var(--surface)}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:6px}
.pick label{display:flex;gap:8px;align-items:center;border:1px solid var(--line-2);border-radius:8px;padding:7px 10px;font-size:13px}
.pick label input{accent-color:var(--accent)}
.pick label .pill{margin-left:auto}
textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);width:100%;min-height:60px}
.note{font-size:12.5px;color:var(--ink-2);background:var(--info-soft);border-radius:8px;padding:9px 12px}

/* slides */
.slides{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.slide{aspect-ratio:16/9;max-width:100%;border:1px solid var(--line);border-radius:6px;background:#FFFFFF;color:#1C1B1E;container-type:inline-size;position:relative;overflow:hidden;display:flex;flex-direction:column;padding:5cqw 5.5cqw 3cqw}
.slide .st{font-family:var(--serif);font-weight:600;font-size:5.4cqw;line-height:1.15}
.slide .sk{font-family:var(--serif);font-size:3.3cqw;color:#48434A;margin-top:1.5cqw;line-height:1.3}
.slide .sn{display:flex;gap:4cqw;margin-top:auto;flex-wrap:wrap}
.slide .sn div{display:flex;flex-direction:column}
.slide .sn b{font-family:var(--mono);font-weight:500;font-size:6cqw;line-height:1.1;color:#C8232C}
.slide .sn span{font-size:2.5cqw;color:#48434A}
.slide .sf{font-family:var(--mono);font-size:1.9cqw;color:#766F73;margin-top:3cqw;border-top:1px solid #E4DEDA;padding-top:1.5cqw}
.slide .snum{position:absolute;right:3cqw;top:2.5cqw;font-family:var(--mono);font-size:2cqw;color:#766F73}
.slide.cover{background:linear-gradient(135deg,#1C1B1E 0%,#3A1418 60%,#C8232C 130%);color:#fff}
.slide.cover .st{font-size:7cqw}
.slide.cover .sk{color:#EBD9D8}
.slide.cover .sf{color:#D8C8C8;border-color:rgba(255,255,255,.2)}
.slide.cover .snum{color:#D8C8C8}

@media (max-width: 860px){
  .body{grid-template-columns:1fr}
  nav.side{position:static;flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  nav.side button{white-space:nowrap}
  nav.side button[aria-current="page"]{box-shadow:inset 0 -2px 0 var(--accent)}
  .navsec,.navsecs{display:none}
  .rq{grid-template-columns:1fr 1fr}
  .rq .raw{grid-column:1 / -1}
  .rqhead{display:none}
  .topbar{position:static}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div class="app">
  <header class="topbar">
    <div class="brand"><div class="mark" aria-hidden="true">R</div><div><b>Report Studio</b><small>ETBrandEquity · Events</small></div></div>
    <div class="evt"><strong>Brand World Summit 2025 · 7th edition</strong><span>4 Jul 2025 · Mumbai · IP event</span></div>
    <div class="spacer"></div>
    <div class="meta">
      <span class="chip sample" title="All people, attendance and engagement figures in this prototype are fictional sample data. Sponsor names are from the public BWS 2025 website.">Sample data</span>
      <span class="chip">Data as of <b class="num" style="margin-left:4px">5 Jul, 06:00</b></span>
      <span class="chip" id="verChip">Draft · not frozen</span>
      <span class="chip" id="readyChip"></span>
      <button class="btn primary" id="genBtn">Generate PPT</button>
    </div>
  </header>

  <div class="timeline" id="timeline"></div>

  <div class="body">
    <nav class="side" id="nav" aria-label="Workspace"></nav>
    <main id="main"></main>
  </div>
</div>

<div class="modal" id="modal" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <header><h2 id="mTitle">Generate PPT</h2><div class="spacer"></div><button class="btn small" id="mClose">Close</button></header>
    <div class="db" id="mBody"></div>
    <footer id="mFoot"></footer>
  </div>
</div>

<script>
(function(){
/* ---------- utilities ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
var rnd=mulberry32(20250704);
function pick(a){return a[Math.floor(rnd()*a.length)]}
function wpick(pairs){var s=0,i;for(i=0;i<pairs.length;i++)s+=pairs[i][1];var r=rnd()*s;for(i=0;i<pairs.length;i++){r-=pairs[i][1];if(r<0)return pairs[i][0]}return pairs[pairs.length-1][0]}
function ri(a,b){return a+Math.floor(rnd()*(b-a+1))}

function pct(x){var v=x*100;return (v<10?v.toFixed(1):Math.round(v))+'%'}

var PALETTE=['var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)','var(--c6)'];
function bars(obj,opts){opts=opts||{};var keys=opts.order?opts.order.filter(function(k){return obj[k]!=null}):Object.keys(obj).sort(function(a,b){return obj[b]-obj[a]});
  var tot=keys.reduce(function(s,k){return s+obj[k]},0),mx=Math.max.apply(null,keys.map(function(k){return obj[k]}));
  return '<div class="bars">'+keys.map(function(k,ix){var v=obj[k];return '<div class="bar"><span class="lab" title="'+esc(k)+'">'+esc(opts.label?opts.label(k):k)+'</span><span class="trk"><span class="fil" style="width:'+(v/mx*100).toFixed(1)+'%;background:'+(opts.color||PALETTE[0])+'"></span></span><span class="val">'+(opts.fmtv?opts.fmtv(v):fmt(v)+(opts.share?' · '+pct(v/tot):''))+'</span></div>'}).join('')+'</div>'}
function donut(obj,center,sub,order,labelFn){var keys=order?order.filter(function(k){return obj[k]}):Object.keys(obj).sort(function(a,b){return obj[b]-obj[a]});
  var tot=keys.reduce(function(s,k){return s+obj[k]},0),acc=0,stops=[];
  keys.forEach(function(k,ix){var a=acc/tot*360,b=(acc+obj[k])/tot*360;stops.push(PALETTE[ix%6]+' '+a.toFixed(2)+'deg '+b.toFixed(2)+'deg');acc+=obj[k]});
  return '<div class="donutwrap"><div class="donut" style="background:conic-gradient('+stops.join(',')+')" role="img" aria-label="'+esc(sub)+'"><div class="ctr"><div><b>'+center+'</b><span>'+esc(sub)+'</span></div></div></div><div class="legend">'+keys.map(function(k,ix){return '<div><i style="background:'+PALETTE[ix%6]+'"></i><span>'+esc(labelFn?labelFn(k):k)+'</span><span class="num">'+fmt(obj[k])+'</span><span class="num">'+pct(obj[k]/tot)+'</span></div>'}).join('')+'</div></div>'}
function tiles(list){return '<div class="tiles">'+list.map(function(t){return '<div class="tile"><div class="v">'+t[1]+'</div><div class="l">'+esc(t[0])+'</div>'+(t[2]?'<div class="n">'+esc(t[2])+'</div>':'')+'</div>'}).join('')+'</div>'}
function curve(){var byDay={},d,days=[];for(d='2025-05-05';d<='2025-07-03';d=addDays(d,1)){byDay[d]=0;days.push(d)}
  PEOPLE.forEach(function(p){if(byDay[p.registered]!=null)byDay[p.registered]++});
  var W=640,H=190,L=40,R=12,T=14,B=26,cum=0,pts=[],max=PEOPLE.length;
  days.forEach(function(dd,ix){cum+=byDay[dd];var x=L+ix/(days.length-1)*(W-L-R),y=T+(1-cum/max)*(H-T-B);pts.push([x,y])});
  var line=pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1)}).join(' ');
  var area='M'+L+','+(H-B)+' L'+line.split(' ').join(' L')+' L'+(W-R)+','+(H-B)+' Z';
  var nl=NLDATES.map(function(nd){var ix=days.indexOf(nd);if(ix<0)return '';var x=L+ix/(days.length-1)*(W-L-R);return '<line x1="'+x+'" x2="'+x+'" y1="'+T+'" y2="'+(H-B)+'" stroke="var(--line)" stroke-dasharray="3 3"/><text x="'+x+'" y="'+(T-3)+'" text-anchor="middle">NL</text>'}).join('');
  var grid=[0.5,1].map(function(f){var y=T+(1-f)*(H-T-B);return '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line-2)"/><text x="'+(L-6)+'" y="'+(y+3)+'" text-anchor="end">'+fmt(max*f)+'</text>'}).join('');
  var last=pts[pts.length-1];
  return '<div class="curve"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Cumulative registrations from 5 May to 3 July">'+grid+nl+'<path d="'+area+'" fill="var(--c2)" opacity=".12"/><polyline points="'+line+'" fill="none" stroke="var(--c2)" stroke-width="2"/><circle cx="'+last[0]+'" cy="'+last[1]+'" r="4" fill="var(--c2)"/><text x="'+L+'" y="'+(H-8)+'">5 May</text><text x="'+(W-R)+'" y="'+(H-8)+'" text-anchor="end">3 Jul</text><text x="'+(L-6)+'" y="'+(H-B+3)+'" text-anchor="end">0</text></svg><div class="foot">Cumulative registrations · dashed lines = newsletter sends</div></div>'}

function renderReview(){var items=reviewItems();var h='<div class="pagehead"><div><h1>Review queue</h1><p>Values the rules could not place. Your choice is saved as an override and reused for every future event.</p></div></div>';
  if(!items.length){main.innerHTML=h+'<div class="empty"><b>Nothing to review</b><span>All designations and sign-up sources are classified. Numbers in the report have been recomputed.</span></div>';return}
  h+='<div class="list"><div class="rq rqhead"><span>Raw value</span><span>Rows</span><span>Classify as</span><span></span><span></span></div>';
  items.forEach(function(it,ix){if(it.kind==='title'){h+='<div class="rq"><span class="raw">'+esc(it.raw)+'<br><span class="foot">Designation</span></span><span class="num">'+it.n+'</span><select id="rqs'+ix+'" aria-label="Seniority for '+esc(it.raw)+'">'+['CXO','VP','Director','Manager','Other'].map(function(o){return '<option'+(o==='Director'&&/custodian|partner/i.test(it.raw)?' selected':o==='Other'&&!/custodian|partner/i.test(it.raw)?' selected':'')+'>'+o+'</option>'}).join('')+'</select><select id="rqf'+ix+'" aria-label="Function for '+esc(it.raw)+'">'+['Marketing','Leadership','Tech','Sales','Other'].map(function(o){return '<option'+(o===it.sug?' selected':'')+'>'+o+'</option>'}).join('')+'</select><button class="btn small" data-apply="'+ix+'">Apply</button></div>'}
    else{h+='<div class="rq"><span class="raw">'+esc(it.raw)+'<br><span class="foot">Sign-up source</span></span><span class="num">'+it.n+'</span><select id="rqs'+ix+'" aria-label="Channel for '+esc(it.raw)+'">'+['Direct','Newsletter','Social','Partner','Referral','Paid','Other'].map(function(o){return '<option'+(o==='Other'?' selected':'')+'>'+o+'</option>'}).join('')+'</select><span></span><button class="btn small" data-apply="'+ix+'">Apply</button></div>'}});
  main.innerHTML=h+'</div>'}
function renderExports(){var h='<div class="pagehead"><div><h1>Exports</h1><p>Every generated deck is frozen with its data version, so what a sponsor received can always be traced.</p></div></div>';
  if(!S.exports.length){main.innerHTML=h+'<div class="empty"><b>No deck generated yet</b><span>Use Generate PPT once the report looks right. The deck is due to sponsors by 12:00 today.</span><span><button class="btn small primary" data-gen="1">Generate PPT</button></span></div>';return}
  h+='<div class="list">'+S.exports.map(function(e){return '<div class="row"><span class="ic good">✓</span><div><div class="t">'+esc(e.version)+' · '+e.sections+' slides</div><div class="d">'+esc(e.note)+'</div></div><div class="side-r"><span>'+esc(e.by)+'</span><span class="num">'+esc(e.time)+'</span></div></div>'}).join('')+'</div>';
  if(S.deck)h+='<h2 style="font-size:19px;margin-top:6px">Slides in '+esc(S.exports[0].version)+'</h2>'+S.deck;
  main.innerHTML=h}
function render(){renderTop();renderNav();({report:renderReport,readiness:renderReadiness,sources:renderSources,quality:renderQuality,review:renderReview,exports:renderExports})[S.tab]()}
function recompute(){processAll();computeMetrics();computeReadiness();render()}

/* ---------- PPT generation (preview) ---------- */
var modal=document.getElementById('modal'),mBody=document.getElementById('mBody'),mFoot=document.getElementById('mFoot');
function openGen(){var h='<p style="margin:0;color:var(--ink-2)">Choose the sections to include. Generating freezes the current numbers as <b>v1 · T+1</b>; the deck reads only that frozen version and carries totals only, never names or emails.</p><div class="pick">';
  SECTIONS.forEach(function(s){var st=secStatus(s);h+='<label><input type="checkbox" id="pk-'+s.id+'" '+(S.include[s.id]&&st!=='bad'?'checked':'')+'> '+esc(s.no==='Cover'?'Cover':s.no+'. '+s.title)+(st==='bad'?'<span class="pill bad">Not ready</span>':st==='warn'?'<span class="pill warn">Partial</span>':'')+'</label>'});
  h+='</div><div><label for="ovr" style="font-size:12.5px;color:var(--ink-2)">If you include a section that is not ready, give a reason (logged)</label><textarea id="ovr" placeholder="e.g. Quotes to follow in v2 at T+14"></textarea></div><div id="genErr" class="foot" style="color:var(--bad)"></div>';
  mBody.innerHTML=h;mFoot.innerHTML='<button class="btn" id="gCancel">Cancel</button><button class="btn primary" id="gGo">Freeze v1 and build slides</button>';modal.hidden=false;
  document.getElementById('gCancel').onclick=closeGen;document.getElementById('gGo').onclick=doGen}
function closeGen(){modal.hidden=true}
function doGen(){var chosen=SECTIONS.filter(function(s){var el=document.getElementById('pk-'+s.id);return el&&el.checked});
  var notReady=chosen.filter(function(s){return secStatus(s)==='bad'});var reason=document.getElementById('ovr').value.trim();
  if(notReady.length&&!reason){document.getElementById('genErr').textContent='Add a reason to include: '+notReady.map(function(s){return s.title}).join(', ');return}
  if(!chosen.length){document.getElementById('genErr').textContent='Choose at least one section.';return}
  var blocking=DQ.filter(function(d){return d.sev==='bad'});if(blocking.length){document.getElementById('genErr').textContent='Fix blocking data-quality checks first.';return}
  var n=0,slides=chosen.map(function(s){n++;var fig=s.slide();var cover=s.id==='cover';
    return '<div class="slide'+(cover?' cover':'')+'"><div class="snum">'+n+' / '+chosen.length+'</div><div class="st">'+(cover?'Brand World Summit’25':esc(s.title))+'</div><div class="sk">'+esc(cover?'Post-event report · 4 July 2025 · Mumbai':(s.take()||''))+'</div>'+(fig?'<div class="sn">'+fig.map(function(f){return '<div><b>'+esc(f[0])+'</b><span>'+esc(f[1])+'</span></div>'}).join('')+'</div>':'<div class="sn"></div>')+'<div class="sf">Source: '+esc(s.src.split(';')[0])+' · Data as of 5 Jul 2025, 06:00 IST · v1</div></div>'}).join('');
  S.version='v1 · T+1 · frozen 08:14';S.deck='<div class="slides">'+slides+'</div>';
  S.exports.unshift({version:'v1 · T+1',sections:chosen.length,note:(notReady.length?'Included not-ready sections: '+notReady.map(function(s){return s.title}).join(', ')+' ("'+reason+'"). ':'')+'PPTX + PDF · template: Design → Top Banner',by:'You (approver)',time:'5 Jul 2025, 08:14'});
  mBody.innerHTML='<div class="note">In production this step downloads the PPTX and PDF. This prototype shows the slides that would be exported.</div>'+S.deck;
  mFoot.innerHTML='<button class="btn" id="gDone">Done</button><button class="btn primary" id="gExp">Open Exports</button>';
  document.getElementById('gDone').onclick=function(){closeGen();render()};document.getElementById('gExp').onclick=function(){closeGen();S.tab='exports';render();window.scrollTo(0,0)};renderTop()}

/* ---------- events ---------- */
document.addEventListener('click',function(e){var t=e.target.closest('[data-tab],[data-go],[data-approve],[data-apply],[data-gen],[data-jump]');if(!t)return;
  if(t.dataset.tab){S.tab=t.dataset.tab;render();window.scrollTo(0,0)}
  else if(t.dataset.go){S.tab=t.dataset.go;render();window.scrollTo(0,0)}
  else if(t.dataset.approve){S.approved[t.dataset.approve]=1;render()}
  else if(t.dataset.gen){openGen()}
  else if(t.dataset.jump){e.preventDefault();var el=document.getElementById('sec-'+t.dataset.jump);if(el)el.scrollIntoView({behavior:'smooth',block:'start'})}
  else if(t.dataset.apply!=null){var it=reviewItems()[+t.dataset.apply];var ix=t.dataset.apply;
    if(it.kind==='title'){OVR.title[it.raw]={sen:document.getElementById('rqs'+ix).value,fn:document.getElementById('rqf'+ix).value}}
    else{OVR.channel[it.raw]=document.getElementById('rqs'+ix).value}
    recompute()}});
document.addEventListener('change',function(e){var t=e.target;
  if(t.dataset.inc){S.include[t.dataset.inc]=t.checked}
  if(t.dataset.csv!=null&&t.files&&t.files[0]){var ix=+t.dataset.csv,fr=new FileReader();fr.onload=function(){var lines=String(fr.result).split(/\r?\n/).filter(function(l){return l.trim()});var hdr=(lines[0]||'').split(',').map(function(x){return x.trim()}).slice(0,6).join(', ');S.sourcesMsg[ix]='Read '+fmt(Math.max(0,lines.length-1))+' rows · columns: '+hdr+(hdr?'…':'')+' (preview only; sample data kept)';render()};fr.readAsText(t.files[0])}});
document.addEventListener('input',function(e){var t=e.target;if(!t.dataset.filter)return;var id=t.dataset.filter,q=t.value.toLowerCase();var s=SECTIONS.filter(function(x){return x.id===id})[0];var det=s.details();
  var rows=det.rows.filter(function(r){return JSON.stringify(r,function(k,v){return k==='org'?v.name:v}).toLowerCase().indexOf(q)>=0});document.querySelector('[data-tbl="'+id+'"]').innerHTML=table(det.cols,rows)});
document.getElementById('genBtn').onclick=openGen;document.getElementById('mClose').onclick=closeGen;
modal.addEventListener('click',function(e){if(e.target===modal)closeGen()});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!modal.hidden)closeGen()});

renderTimeline();recompute();
})();
</script>
