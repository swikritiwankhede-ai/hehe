      return '<div class="leader"><div><div class="nm">'+esc(s.name)+'</div><div class="sub">'+esc(s.desig)+(s.company?', '+esc(s.company):'')+'</div></div><div>'+(f?'<div class="mono b">'+esc(f.name)+'</div>'+(f.status==='done'?'<blockquote>“'+esc(f.transcript)+'”</blockquote><div class="sub">Sample transcript excerpt (prototype)</div>':'<div class="sub">'+(f.status==='queued'?'Transcribing…':'Not transcribed yet')+'</div>'):'<div class="sub">No recording matched</div>')+'</div><div>'+(f?(f.status==='done'?'<span class="pill good">Transcribed</span>':f.status==='queued'?'<span class="pill info">Queued</span>':'<span class="pill neutral">File matched</span>'):'<span class="pill warn">Missing file</span>')+'</div></div>'}).join('')}
  else{var sel=files.filter(function(f){return f.selected}).length;
    h+='<div class="row2" style="justify-content:space-between"><span class="hint">'+files.filter(function(f){return M.tab==='social'?f.sponsor:f.speaker!==''}).length+' of '+files.length+' matched automatically</span><button class="btn primary small" id="txSel" '+(sel?'':'disabled')+'>Transcribe selected ('+sel+')</button></div><div class="tbl"><table><thead><tr><th>Pick</th><th>File</th><th class="r">MB</th><th>'+(M.tab==='social'?'Sponsor':'Leader')+'</th><th>Matched by</th><th>Transcript</th></tr></thead><tbody>'+
    files.map(function(f,ix){var opts=M.tab==='social'?['<option value="">Unassigned</option>'].concat(S.site.sponsors.map(function(s){return '<option'+(f.sponsor===s.name?' selected':'')+'>'+esc(s.name)+'</option>'})).join(''):['<option value="">Unassigned</option>'].concat(S.site.speakers.map(function(s,i){return '<option value="'+i+'"'+(f.speaker===String(i)?' selected':'')+'>'+esc(s.name)+(S.key[i]?' ★':'')+'</option>'})).join('');
      return '<tr><td><input type="checkbox" data-msel="'+ix+'" '+(f.selected?'checked':'')+' aria-label="Pick '+esc(f.name)+'" style="accent-color:var(--accent)"></td><td class="mono b">'+esc(f.name)+'</td><td class="r">'+f.size+'</td><td><select data-massign="'+ix+'" aria-label="Assign '+esc(f.name)+'">'+opts+'</select></td><td>'+(f.how==='Not matched'?'<span class="pill warn">Not matched</span>':'<span class="pill neutral">'+esc(f.how)+'</span>')+'</td><td>'+(f.status==='done'?'<span class="pill good">Done</span>':f.status==='queued'?'<span class="pill info">Queued</span>':'<span class="pill neutral">Not started</span>')+'</td></tr>'}).join('')+'</tbody></table></div>'}
  return h+'</div>'+navfoot()}

var PLATS=['LinkedIn','Instagram','YouTube'];
function samplePosts(){var out=[],d0=new Date('2025-05-12');var types=['Announcement','Speaker post','Partner post','Countdown','Event video','Reel','Panel clip'];
  for(var i=0;i<28;i++){var pre=i<18;var dt=pre?new Date(d0.getTime()+Math.floor(rnd()*52)*864e5):new Date('2025-07-04');var pl=pick(PLATS);var imp=Math.round((pre?(pl==='LinkedIn'?26000:pl==='Instagram'?21000:15000):(pl==='LinkedIn'?9000:7000))*(0.5+rnd()));out.push({platform:pl,type:pre?pick(types.slice(0,4)):pick(types.slice(4)),date:dt.toISOString().slice(0,10),window:pre?'Pre-event':'Event day',impressions:imp})}
  return out.sort(function(a,b){return a.date<b.date?-1:1})}
function vSocial(){var So=S.social;
  var h='<div class="head"><h1>Social media</h1><p>Pre-event posts and event videos across LinkedIn, Instagram and YouTube. Analytics connections fetch impressions daily; until a connection is approved, the team uploads each platform’s <b>page-level</b> export once, not post by post.</p></div><div class="panel"><h2>Platforms</h2><div class="srcrow">'+PLATS.map(function(p){var c=So.conn[p],u=So.uploads[p];return '<div class="src" style="cursor:default;flex-direction:column"><b>'+p+'</b><span>'+(c?'<span class="pill good">Connected (sample)</span>':u?'<span class="pill good">Export uploaded · '+esc(u)+'</span>':'<span class="pill warn">Not connected</span>')+'</span><span>'+(p==='LinkedIn'?'Page analytics API needs LinkedIn approval.':p==='Instagram'?'Needs the business account linked to a Meta app.':'YouTube Analytics API · channel owner sign-in.')+'</span><div class="row2"><button class="btn small" data-conn="'+p+'">'+(c?'Disconnect':'Connect analytics')+'</button><label class="btn small filebtn">Upload export<input type="file" accept=".xlsx,.xls,.csv" data-sup="'+p+'"></label></div></div>'}).join('')+'</div>'+
  flag('info','Windows used in the report: pre-event = post date to event start (4 Jul, 08:00); event day = 4 Jul. Every post URL is logged in the post register as it goes live.')+'</div>';
  if(So.posts){var pre=So.posts.filter(function(p){return p.window==='Pre-event'}),dur=So.posts.filter(function(p){return p.window==='Event day'});var s=function(a){return a.reduce(function(t,p){return t+p.impressions},0)};
    h+='<div class="panel"><h2>Posts received</h2><div class="stats"><div class="stat"><b>'+pre.length+'</b><span>pre-event posts</span></div><div class="stat"><b>'+fmt(s(pre))+'</b><span>pre-event impressions</span></div><div class="stat"><b>'+dur.length+'</b><span>event-day posts and videos</span></div><div class="stat"><b>'+fmt(s(dur))+'</b><span>event-day impressions</span></div></div><div class="tbl"><table><thead><tr><th>Date</th><th>Platform</th><th>Type</th><th>Window</th><th class="r">Impressions</th></tr></thead><tbody>'+So.posts.map(function(p){return '<tr><td class="mono">'+p.date+'</td><td>'+p.platform+'</td><td>'+p.type+'</td><td>'+p.window+'</td><td class="r">'+fmt(p.impressions)+'</td></tr>'}).join('')+'</tbody></table></div><p class="hint">Sample rows for the prototype.</p></div>'}
  return h+navfoot()}

function vInsights(){var I=S.insights,v=I.vertical,rows=I.rows[v];
  var h='<div class="head"><h1>Market insights</h1><p>A small library of market statistics per vertical, kept with source and year. It isn’t event data, so it is maintained once a year, not uploaded for every event.</p></div><div class="panel"><div class="tabs" role="tablist">'+['BrandEquity','CIO','CISO'].map(function(x){return '<button role="tab" data-vert="'+x+'" aria-selected="'+(x===v)+'">'+x+'</button>'}).join('')+'</div>'+
  '<p class="hint">'+(I.reviewed[v]?'Last reviewed '+I.reviewed[v]+'. Stats older than 12 months are flagged in the report.':'No stats yet for '+v+'.')+'</p><div class="tbl"><table><thead><tr><th>Statistic</th><th>Value</th><th>Source</th><th>Year</th></tr></thead><tbody>'+
  rows.map(function(r,ix){return '<tr>'+['stat','value','source','year'].map(function(k){return '<td><input type="text" data-ins="'+ix+'" data-k="'+k+'" value="'+esc(r[k])+'" aria-label="'+k+'"></td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div><div class="row2"><button class="btn small" id="insAdd">Add statistic</button></div></div>';
  return h+navfoot()}

function render(){renderRail();main.innerHTML=[vEvent,vSponsors,vSpeakers,vAttendees,vMedia,vSocial,vInsights][S.step]()}

/* ---------- website parser (fallback) ---------- */
function parseSite(html){var d=new DOMParser().parseFromString(html,'text/html');var body=d.body,style=(body&&body.getAttribute('style'))||'';
  function cssVar(n){var m=style.match(new RegExp('--'+n+':\\s*([^;]+)'));return m?m[1].trim():''}
  var ban=d.getElementById('banner');var hid=ban?ban.querySelectorAll('.hidden'):[];var name='',theme='';hid.forEach(function(x){if(x.tagName==='H3')name=x.textContent.trim();if(x.tagName==='P')theme=x.textContent.trim()});
  var lcn=ban?Array.prototype.map.call(ban.querySelectorAll('.lcn .icn-box, .lcn div'),function(x){return x.textContent.trim()}).filter(Boolean):[];
  var bg=ban&&ban.getAttribute('style')?(ban.getAttribute('style').match(/url\(([^)]+)\)/)||[])[1]:'';
  var sp=[],seen={},raw=0;d.querySelectorAll('.sponsor-box').forEach(function(box){var g=box.querySelector('h4');g=g?g.textContent.trim():'';box.querySelectorAll('a[title]').forEach(function(a){raw++;var k=g+'|'+a.getAttribute('title');if(seen[k])return;seen[k]=1;var img=a.querySelector('img');sp.push({group:g,name:a.getAttribute('title'),logo:img?(img.getAttribute('src')||img.getAttribute('data-src')||''):''})})});
  var comp={};var ag=d.getElementById('agenda');if(ag){var parts=ag.innerText?ag.innerText.split('\n'):ag.textContent.split('\n');parts=parts.map(function(x){return x.trim()}).filter(Boolean);for(var i=0;i<parts.length-1;i++){if(parts[i].split(' ').length<=4&&parts[i+1].indexOf(',')>0&&!/\d/.test(parts[i]))comp[parts[i].toLowerCase()]=comp[parts[i].toLowerCase()]||parts[i+1]}}
  var spk=[],sn={},rawS=0;d.querySelectorAll('article').forEach(function(a){var h5=a.querySelector('h5');var c=a.querySelector('.caption span');if(!h5||!c)return;rawS++;var n=h5.textContent.trim();if(sn[n])return;sn[n]=1;var ds=c.textContent.trim().replace(/ /g,' ');var full=comp[n.toLowerCase()]||'';var co='';if(full&&full.toLowerCase().indexOf(ds.toLowerCase())===0)co=full.slice(ds.length).replace(/^[ ,]+/,'');else if(full)co=full.split(',').pop().trim();spk.push({name:n,desig:ds,company:co})});
  if(!name&&!sp.length&&!spk.length)return null;
  var hash=d.querySelector('.banner-hash');
  return {event:{name:name||S.site.event.name,edition:S.site.event.edition,theme:theme||'',hashtag:hash?hash.textContent.trim():'',date:lcn[0]||'',venue:lcn[1]||'',themeColor:cssVar('theme-color')||'#C8232C',bodyFont:(cssVar('body-font-family').split(',')[0]||''),headingFont:(cssVar('heading-font-family').split(',')[0]||''),banner:bg||''},sponsors:sp,rawSponsors:raw,speakers:spk,rawSpeakers:rawS}}

/* ---------- events ---------- */
document.addEventListener('click',function(e){var t=e.target.closest('button,[data-step]');if(!t)return;
  if(t.dataset.step!=null){S.step=+t.dataset.step;render();window.scrollTo(0,0);return}
  if(t.id==='parseBtn'){var r=parseSite(document.getElementById('html').value);var m=document.getElementById('parseMsg');if(!r){m.textContent='Could not find the banner, sponsors or speakers in that HTML. Paste the full page source.';return}S.site=r;S.siteSource='Pasted page';applySpeakerDefaults();render();return}
  if(t.id==='keyCxo'){applySpeakerDefaults();render();return}
  if(t.id==='keyNone'){S.key={};render();return}
  if(t.id==='attSample'){loadRows('OneWorld_BWS2025_registrations.xlsx (sample)',sampleAttendees());return}
  if(t.id==='attImport'){var v=validate();S.att.imported={rows:v.ok,attended:v.attended,time:new Date().toTimeString().slice(0,5)};render();return}
  if(t.id==='driveConnect'){sampleMedia();S.media.tab='leaders';if(S.media.auto)autoTranscribe();render();return}
  if(t.dataset.mtab){S.media.tab=t.dataset.mtab;render();return}
  if(t.id==='txSel'){var files=S.media.tab==='social'?S.media.social:S.media.sessions;transcribe(files.filter(function(f){return f.selected}));return}
  if(t.dataset.conn){var p=t.dataset.conn;S.social.conn[p]=!S.social.conn[p];if(!S.social.posts&&S.social.conn[p])S.social.posts=samplePosts();render();return}
  if(t.dataset.vert){S.insights.vertical=t.dataset.vert;render();return}
  if(t.id==='insAdd'){S.insights.rows[S.insights.vertical].push({stat:'',value:'',source:'',year:''});render();return}
});
function transcribe(list){list.forEach(function(f){f.status='queued';f.selected=false});render();setTimeout(function(){list.forEach(function(f,i){f.status='done';f.transcript=SAMPLE_TX[(f.name.length+i)%SAMPLE_TX.length]});render()},1400)}
function autoTranscribe(){transcribe(S.media.sessions.filter(function(f){return f.speaker!==''}))}
document.addEventListener('change',function(e){var t=e.target;
  if(t.name==='eventSrc'){S.eventSrc=t.value;render()}
  else if(t.name==='sponsorSrc'){S.sponsorSrc=t.value;render()}
  else if(t.name==='speakerSrc'){S.speakerSrc=t.value;render()}
  else if(t.name==='attSrc'){S.att.src=t.value;render()}
  else if(t.dataset.tier!=null){S.tierOverride[t.dataset.tier]=t.value}
  else if(t.dataset.key!=null){S.key[t.dataset.key]=t.checked;renderRail();var h2=main.querySelector('.panel:nth-of-type(2) h2');if(h2)h2.textContent=keyCount()+' key speakers of '+S.site.speakers.length}
  else if(t.dataset.co!=null){S.site.speakers[+t.dataset.co].company=t.value.trim();render()}
  else if(t.dataset.map!=null){S.att.map[t.dataset.map]=t.value;S.att.preset=false;render()}
  else if(t.id==='savePreset'){S.att.preset=t.checked}
  else if(t.id==='autoTx'){S.media.auto=t.checked}
  else if(t.dataset.msel!=null){var fl=S.media.tab==='social'?S.media.social:S.media.sessions;fl[+t.dataset.msel].selected=t.checked;render()}
  else if(t.dataset.massign!=null){var fl2=S.media.tab==='social'?S.media.social:S.media.sessions;var f=fl2[+t.dataset.massign];if(S.media.tab==='social'){f.sponsor=t.value}else{f.speaker=t.value}f.how=t.value?'Assigned by you':'Not matched';render()}
  else if(t.id==='attFile'&&t.files[0]){readSheet(t.files[0],function(rows){loadRows(t.files[0].name,rows)})}
  else if(t.id==='spFile'&&t.files[0]){readSheet(t.files[0],function(rows){document.getElementById('spMsg').textContent='Read '+rows.length+' rows · columns: '+(rows[0]?Object.keys(rows[0]).join(', '):'none')+' (preview only in the prototype)'})}
  else if(t.dataset.sup&&t.files[0]){var p=t.dataset.sup,nm=t.files[0].name;readSheet(t.files[0],function(rows){S.social.uploads[p]=nm+' · '+rows.length+' rows';if(!S.social.posts)S.social.posts=samplePosts();render()})}
  else if(t.id==='mediaFile'&&t.files.length){addMedia(t.files)}
});
document.addEventListener('input',function(e){var t=e.target;if(t.dataset.ins!=null){S.insights.rows[S.insights.vertical][+t.dataset.ins][t.dataset.k]=t.value}});
function readSheet(file,cb){var fr=new FileReader();fr.onload=function(){try{var wb=window.XLSX?XLSX.read(fr.result,{type:'array'}):null;if(!wb){cb([]);return}var ws=wb.Sheets[wb.SheetNames[0]];cb(XLSX.utils.sheet_to_json(ws,{defval:''}))}catch(err){cb([])}};fr.readAsArrayBuffer(file)}
function addMedia(fileList){Array.prototype.forEach.call(fileList,function(f){S.media.sessions.push({name:f.name,type:/audio/.test(f.type)?'audio':'video',size:Math.max(1,Math.round(f.size/1048576)),speaker:'',status:'new',selected:false,transcript:''})});automatch();S.media.tab='sessions';render()}
document.addEventListener('dragover',function(e){var d=e.target.closest('.drop');if(d){e.preventDefault();d.classList.add('over')}});
document.addEventListener('dragleave',function(e){var d=e.target.closest('.drop');if(d)d.classList.remove('over')});
document.addEventListener('drop',function(e){var d=e.target.closest('.drop');if(!d)return;e.preventDefault();d.classList.remove('over');var fs=e.dataTransfer.files;if(!fs||!fs.length)return;
  if(d.id==='attDrop')readSheet(fs[0],function(rows){loadRows(fs[0].name,rows)});else if(d.id==='mediaDrop')addMedia(fs)});
render();
})();
</script>
